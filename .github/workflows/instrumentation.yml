name: Coverage and sanitizers

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: ${{ matrix.mode }} (regression checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [coverage, asan-ubsan]
    env:
      CC: clang-18
      CXX: clang++-18
      LLVM_COV: llvm-cov-18
      LLVM_PROFDATA: llvm-profdata-18
      ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
      RACK_SDK_VERSION: '2.6.3'
      RACK_SDK_SHA256: 9571627becc12092c3279fc473e48dda62ca049b1d6158ee157996547568393d
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install instrumentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-18 llvm-18 make

      - name: Install Rack dependencies
        run: |
          sudo apt-get install --yes --no-install-recommends \
            make jq curl unzip libglu1-mesa-dev libx11-dev \
            libasound2t64 libjack-jackd2-0 libpulse0

      - name: Download and verify Rack SDK
        run: |
          sdk_archive="$RUNNER_TEMP/Rack-SDK.zip"
          curl --fail --location --retry 3 \
            "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-lin-x64.zip" \
            --output "$sdk_archive"
          printf '%s  %s\n' "$RACK_SDK_SHA256" "$sdk_archive" | sha256sum --check
          unzip -q "$sdk_archive" -d "$RUNNER_TEMP"
          echo "RACK_DIR=$RUNNER_TEMP/Rack-SDK" >> "$GITHUB_ENV"

      - name: Run instrumented regression checks
        env:
          MODE: ${{ matrix.mode }}
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        shell: bash
        run: |
          report="$RUNNER_TEMP/reports/$MODE"
          build="$RUNNER_TEMP/instrumented/$MODE"
          mkdir -p "$report"
          flags='-fsanitize=address,undefined -fno-sanitize-recover=all'
          if [ "$MODE" = coverage ]; then
            flags='-fprofile-instr-generate -fcoverage-mapping'
            mkdir -p "$report/raw"
            export LLVM_PROFILE_FILE="$report/raw/%m-%p.profraw"
          fi
          "$CXX" --version | tee "$report/compiler.txt"
          # pipefail preserves compiler, assertion, and sanitizer failures.
          make -C tests -B -j2 BUILD="$build" SANITIZERS="$flags" 2>&1 | tee "$report/run.log"

      - name: Generate coverage reports
        if: success() && matrix.mode == 'coverage'
        shell: bash
        run: |
          report="$RUNNER_TEMP/reports/coverage"
          build="$RUNNER_TEMP/instrumented/coverage"
          "$LLVM_PROFDATA" merge -sparse "$report"/raw/*.profraw -o "$report/coverage.profdata"
          # Limit the report to Rack integration exercised by these fixtures.
          # Bundled emulation libraries, SDK headers, and fixtures are excluded.
          sources=(src/RackNES.cpp src/CVGenie.cpp src/GameMaps.hpp src/theme.hpp)
          args=("$build/cv-genie" -object "$build/racknes"
                "-instr-profile=$report/coverage.profdata" -sources "${sources[@]}")
          "$LLVM_COV" report "${args[@]}" > "$report/summary.txt"
          "$LLVM_COV" export -format=lcov "${args[@]}" > "$report/coverage.lcov"
          "$LLVM_COV" show -format=html "-output-dir=$report/html" "${args[@]}"
          {
            echo '### Rack integration coverage'
            echo '```text'
            cat "$report/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.mode }}-rack
          path: ${{ runner.temp }}/reports/${{ matrix.mode }}/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
