name: Manuals and white paper

on:
  pull_request:
    paths: ['manual/**', 'whitepaper/**', 'src/**', 'res/**', 'tools/capture/**', 'tools/update_game_list.py', 'plugin.json', '.github/workflows/manuals.yml']
  push:
    branches: [master]
    tags: ['v*', '[0-9]*']
    paths: ['manual/**', 'whitepaper/**', 'src/**', 'res/**', 'tools/capture/**', 'tools/update_game_list.py', 'plugin.json', '.github/workflows/manuals.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag containing both manuals and the white paper
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pdfs-${{ github.event_name }}-${{ inputs.tag || github.event.release.tag_name || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}

jobs:
  build:
    name: Build and validate publication PDFs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out publication sources
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Install publication tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            texlive-latex-extra texlive-pictures texlive-fonts-recommended cm-super lmodern latexmk poppler-utils python3-pypdf

      - name: Check CV Genie game list
        run: python3 tools/update_game_list.py --check

      - name: Check release and manual versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          test -f manual/latex/manual.mk
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          version = json.loads(Path('plugin.json').read_text())['version']
          tag = os.environ['RELEASE_TAG']
          if tag:
              assert tag in (version, 'v' + version), (tag, version)
          for module in ('RackNES', 'CVGenie'):
              source = Path('manual', module, 'manual.tex').read_text()
              assert '\\newcommand{\\manualversion}{' + version + '}' in source, module
          PY

      - name: Build PDFs
        run: |
          make -C manual
          make -C whitepaper

      - name: Validate PDFs and stage release names
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          version = json.loads(Path('plugin.json').read_text())['version']
          for module in ('RackNES', 'CVGenie'):
              pdf = PdfReader(Path('manual', module, '.build', 'manual.pdf'))
              assert len(pdf.pages) > 5, module
              assert version in pdf.metadata.title, module
              assert pdf.outline, module
              assert pdf.trailer['/Root']['/Lang'] == 'en-US', module
              assert pdf.xmp_metadata, module
              text = '\n'.join(page.extract_text() or '' for page in pdf.pages)
              assert 'Arhythmetic Units' in text and 'KautenjaDSP' not in text, module
              assert '??' not in text, module
          pdf = PdfReader(Path('whitepaper/.build/racknes.pdf'))
          assert len(pdf.pages) > 1, 'white paper'
          assert 'RackNES' in pdf.metadata.title, 'white paper'
          assert pdf.outline, 'white paper'
          text = '\n'.join(page.extract_text() or '' for page in pdf.pages)
          assert '??' not in text, 'white paper'
          PY
          mkdir -p publication-pdfs
          cp manual/RackNES/.build/manual.pdf publication-pdfs/RackNES.pdf
          cp manual/CVGenie/.build/manual.pdf publication-pdfs/CVGenie.pdf
          cp whitepaper/.build/racknes.pdf publication-pdfs/RackNES-whitepaper.pdf
          for pdf in publication-pdfs/*.pdf; do
            test -s "$pdf"
            pdfinfo "$pdf"
          done

      - name: Save publication PDFs
        uses: actions/upload-artifact@v7
        with:
          name: publication-pdfs
          path: publication-pdfs/*.pdf
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Attach PDFs to release
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download validated PDFs
        uses: actions/download-artifact@v8
        with:
          name: publication-pdfs
          path: pdfs
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            pdfs/RackNES.pdf pdfs/CVGenie.pdf pdfs/RackNES-whitepaper.pdf --clobber
